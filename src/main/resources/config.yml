# HomingMissiles 3.1.4
# Paper/Purpur 1.21.x，Java 21。
# 速度单位为“方块/tick”；正常服务器每秒20 tick。
# 修改后可执行 /hbow reload。在线调参可使用 /hbow tune。

config-version: 7

tracking:
  # 拉弓标定只在近圈发生，避免误锁非常远的玩家。
  range: 96.0

  # 一旦建立锁定，当前目标可在更大的保持圈内继续被追踪。
  # 该值必须不小于 range；均衡空战配置约为首次捕获距离的 2.33 倍。
  lock-retention-range: 224.0

  # 最大飞行寿命。260 tick = 13秒，足够二次追赶且不会长期占用在途通道。
  max-lifetime-ticks: 260

  # 发射后延迟多久开始索敌，避免刚离弦便急转。
  activation-delay-ticks: 4

  # 每tick允许改变的最大飞行角度。
  turn-rate-degrees-per-tick: 7.0

  # 巡航段每tick增加的速度。可设为轻微负值，但不能低于 min-speed。
  acceleration-per-tick: 0.015

  min-speed: 1.0
  max-speed: 3.2

  # 后程发动机一旦点火就不会关闭。达到锁定时长，或者目标连续拉远时都会触发。
  terminal-boost:
    delay-ticks: 36
    escape-trigger-ticks: 6
    acceleration-per-tick: 0.06
    max-speed: 4.8

  # 按目标当前速度预判若干tick后的位置。0表示不预判。
  lead-ticks: 4.0

  # 动态截击解允许的最大预判时间；无可行截击解时向该上限提前瞄准。
  max-lead-ticks: 24.0

  # 6版起制导箭只追踪发射前手动标定的目标；保留此键仅用于旧配置兼容。
  dynamic-retargeting: false

  # 6版不再使用；保留旧值，便于旧配置被安全读取。
  switch-advantage-blocks: 3.0

  # true：目标与箭之间被方块遮挡时不锁定。会增加计算成本。
  require-line-of-sight: false

  target-creative: false
  target-spectator: false

  # true：尊重常见隐身插件的 canSee 结果，射手看不到的玩家不会被锁定。
  respect-vanish: true

  # true：关闭箭重力；仍保留原版碰撞和伤害。
  no-gravity: true

targeting:
  manual-lock:
    # 必须拉住弓，把一名有效玩家持续保持在中央锁定视锥内，完成后松弦才会发射。
    duration-ticks: 18
    # 新目标进入此半角范围才开始标定。9度要求主动瞄准，但仍容许飞行抖动。
    cone-degrees: 9.0
    # 已锁目标可在更大的视锥内短暂保持，避免轻微手抖立即断锁。
    break-cone-degrees: 14.0
    break-grace-ticks: 5

limits:
  # 全服务器同时在途的制导箭上限。
  max-tracked-arrows: 128

  # 单个玩家同时在途的制导箭上限。插件硬上限为4，管理员绕过权限也不能突破。
  max-tracked-per-player: 4

  # 每次发射之间的冷却tick。0表示关闭。
  launch-cooldown-ticks: 0

  # 被权限、世界、冷却或上限拒绝时是否取消射击。
  # true可避免“制导弓突然射出普通箭”的误解。
  cancel-rejected-shot: true

combat:
  # 高伤害型默认值：伤害不会低于此值；-1表示完全保留原版计算。
  # 采用“最低伤害”而非强制覆盖，因此力量附魔等更高结果仍会保留。
  minimum-arrow-damage: 12.0

worlds:
  # 按世界文件夹名称填写，不区分大小写。
  disabled: []
  # 示例：
  # disabled: [world_nether, lobby]

visual:
  glowing-arrow: false
  # 点火尾焰、白烟弹道、推进器闪光均由此总开关控制。
  particles: true
  particle-interval-ticks: 1

audio:
  # 使用火箭/弩机/信标/幽匿与监守者的分层原声音色，不再使用音符盒蜂鸣。
  launch-sound: true
  lock-sounds: true

# 可选值：actionbar / chat / off
# 高频战斗反馈默认走Action Bar，避免刷屏。
feedback:
  # 正常战斗态由像素 HMD 表达，不再用文字占用 ActionBar。
  launch: off
  lock-shooter: off
  lock-target: off
  rejection: actionbar

# FlightHud 风格的动态分层像素 HUD / 空间化来袭警报。
# pixel-overlay 需要本项目生成的 HUD 资源包；加载成功后 ActionBar 承载带负间距的图形图层流，
# 动态组合航向、速度、高度、离地高度、俯仰梯、飞行矢量、挂点与威胁层。BossBar 仅在资源包未就绪时降级使用。
hud:
  enabled: true
  pixel-overlay: true
  client-mod:
    # 客户端 Mod 在登录后主动握手；检测到时插件不再发送 HUD 资源包。
    # 留空仍会推荐安装，但不附下载链接。
    download-url: 'https://github.com/usermbzlj/HomingMissiles/releases/tag/v3.1.4'
    detection-grace-ticks: 40
  shooter-bossbar: true
  target-bossbar: true
  resource-pack:
    # 必须是客户端能够公开访问的 HTTP/HTTPS 地址。留空时不主动发送资源包。
    url: ''
    # 填写对应 HUD ZIP 的 SHA-1（不是插件 JAR 的 SHA-256）。
    sha1: ''
    required: false
    prompt: '&b启用动态飞行导弹头显与座舱音效'
    # 若你已把 homingmissiles:hud 合并进 server.properties 的全服资源包，可设为 true。
    assume-server-pack-provides-hud: false
    # 可选：由插件进程直接提供上面的 ZIP。默认关闭，不会额外监听端口。
    # 文件固定放在 plugins/HomingMissiles/hud/HomingMissiles-HUD-1.21.11.zip。
    self-host:
      enabled: false
      bind-address: '0.0.0.0'
      port: 25568
      path: '/homingmissiles/hud-1.21.11.zip'
  warning-audio: true
  # 资源包就绪时使用原创座舱告警音；否则回退到原版音效。来袭声从导弹方向播放，距离越近节奏越紧。
  warning-min-interval-ticks: 4
  warning-max-interval-ticks: 24

effects:
  launch: true
  impact: true
  self-destruct: true

lifecycle:
  # true：插件关闭/服务器重载时删除在途箭。
  # false：保留箭，并依靠下面的恢复机制在再次启用时接管。
  remove-arrows-on-disable: true

  # 启用时恢复已加载区块里带持久化标记的制导箭。
  recover-arrows-on-enable: true

commands:
  help-page-size: 7
  max-give-amount: 64

item:
  name: '&b&l制导弓'
  lore:
    - '&7拉弓瞄准并完成手动锁定后才能发射'
    - '&7高伤害制导武器 · 四联数据链'
    - '&7目标遥测对发射者保密'
    - '&7锁定目标唯一绑定 · 真实Motion转向'
    - '&8每人最多 4 枚在途弹药'
  enchantments:
    # 各项均可独立关闭；默认开启。
    flame: true
    infinity: true
    unbreakable: true
    # 0关闭力量附魔，1～5为附魔等级。
    power-level: 5

# 所有消息支持 & 颜色符号和 {placeholder} 占位符。
# 未列出的消息使用插件内置安全默认值。
messages:
  prefix: '&8[&b制导箭&8] &r'
  no-permission: '&c你没有权限执行此操作。&7（{permission}）'
  player-only: '&c该命令只能由游戏内玩家执行。'
  player-not-found: '&c找不到在线玩家：&f{player}'
  world-not-found: '&c找不到世界：&f{world}'
  invalid-number: '&c{input} 不是有效数字。'
  invalid-integer: '&c{input} 不是有效整数。'
  invalid-amount: '&c数量必须是 {min}～{max} 的整数。'
  unknown-command: '&c未知子命令：&f{input}&c。{suggestion}'
  internal-error: '&c命令执行失败。错误编号：&f{reference}&c，请查看服务端日志。'
  usage: '&e正确用法：&f{usage}'

  launch: '&a制导箭已发射 &8· &7在途 &f{active}/{limit}'
  guidance-link: '&b制导链路已建立。&7目标遥测已由系统保密。'
  inbound-warning: '&4警告：&c侦测到来袭制导弹药。'
  rejected-permission: '&c你没有使用制导弓的权限。'
  rejected-global-limit: '&e全服在途制导箭已达到上限 {limit}。'
  rejected-player-limit: '&e你已有 {active}/{limit} 支制导箭在途。'
  rejected-cooldown: '&e制导弓冷却中，还需 {ticks} tick。'
  rejected-world: '&e当前世界已禁用制导弓。'
  rejected-manual-lock: '&c未完成手动锁定。&7拉住弓并把目标保持在锁定框内。'

  give-sender: '&a已给予 &f{player} &a制导弓 ×{amount}。{dropped}'
  give-target: '&a你获得了制导弓 ×{amount}。'
  clear: '&a已清除 &f{count} &a支在途制导箭。'
  reload: '&a配置已原子重载。&7警告：&f{warnings}&7，当前在途箭保留。'
  preset: '&a已应用预设：&f{name}&7（{key}）'
  tune: '&a已设置 &f{key}&a = &f{value}&7（{description}）'
  tune-reset: '&a已重置 &f{key}&a = &f{value}'
